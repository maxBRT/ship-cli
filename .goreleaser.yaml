# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: ship
    main: ./cmd/ship
    binary: ship
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/maxBRT/ship-cli/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    # GoReleaser-recommended name template (uname-compatible OS/Arch).
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
